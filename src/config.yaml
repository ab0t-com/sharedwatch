# sharedwatch config — every key is optional; uncomment to override defaults.
# Resolution order: built-in defaults < this file < global flags (--watch-path, --db, …)
# Defaults land under $XDG_DATA_HOME/sharedwatch (or $HOME/.local/share/sharedwatch).

# watch_path: ./watched
# data_dir: ./data
# storage_type: sqlite
# db_path: ./data/queue.db
# recursive: true
# coalesce_window: 5s
# passive_interval: 10m
# active_interval: 5s
# active_ttl: 30m
# reconcile_interval: 30m
# max_batch_size: 100
# ignore_patterns: .git,.DS_Store,*.tmp,*.swp
# retention_days: 30
# actor_ttl: 5m              # staleness threshold for `status --actors` and actor-prune retention
# watch_roots: auth=/workspace/projects/auth,billing=/workspace/projects/billing
# multi-root: comma-separated `label=path` list. When set, supersedes `watch_path`.
